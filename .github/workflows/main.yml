name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Build
        run: ./gradlew build

      - name: Archive artifacts (Build)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Build
          path: |
             ./*
